name: Build Chat Faces

on:
  push:
    paths:
      - 'chat-faces/**'
      - '.github/workflows/chat-faces.yml'
  pull_request:
    paths:
      - 'chat-faces/**'
      - '.github/workflows/chat-faces.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: chat-faces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: ./gradlew --no-daemon build compileSmokeJava
      - name: Prepare virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
      - name: Exercise real client rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 600s xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon runClientSmoke > smoke-launch.log 2>&1
      - name: Check smoke result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('run-smoke/smoke-results.json').read_text())
          assert result['success'], result
          print(json.dumps(result, indent=2))
          PY
      - name: Record SHA-256 hashes
        run: sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Chat-Faces-1.0.0-NeoForge-1.21.1
          path: |
            chat-faces/build/libs/*.jar
            chat-faces/build/libs/SHA256SUMS.txt
            chat-faces/build/distributions/*.zip
          if-no-files-found: error
      - name: Preserve client test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Faces-client-test-evidence
          path: |
            chat-faces/smoke-launch.log
            chat-faces/run-smoke/smoke-results.json
            chat-faces/run-smoke/smoke-*.png
            chat-faces/run-smoke/logs/latest.log
            chat-faces/build/reports/tests/test/**
          if-no-files-found: warn
